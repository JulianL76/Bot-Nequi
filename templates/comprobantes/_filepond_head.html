{% load static %}
{% comment %}
Assets de FilePond + motor de subida para las pantallas de subida (subir, conciliar).

Los assets se sirven desde static/vendor/filepond/ y NO desde un CDN: al navegar
con hx-boost los <script src> externos cargan async, y con jsDelivr lento quedaba
a la vista el selector nativo del navegador antes de que FilePond lo reemplazara
(y si el CDN estaba bloqueado, no cargaba nunca). Versiones fijadas en
static/vendor/filepond/VERSIONES.md.

Sin plugin de miniaturas a propósito: con cientos de fotos decodificar previews
congela el navegador.
{% endcomment %}
<link href="{% static 'vendor/filepond/filepond.min.css' %}" rel="stylesheet">
<style>
  .filepond--root { font-family: inherit; margin-bottom: 0; }
  .filepond--panel-root { background: #faf5ff; border: 2px dashed #c4b5fd; border-radius: 14px; }
  .dark .filepond--panel-root { background: rgba(124,58,237,.10); border-color: rgba(139,92,246,.45); }
  .filepond--drop-label { color: #6d28d9; font-weight: 500; }
  .dark .filepond--drop-label { color: #c4b5fd; }
  .filepond--label-action { text-decoration-color: #7c3aed; color: #7c3aed; }
  .dark .filepond--label-action { color: #c4b5fd; text-decoration-color: #c4b5fd; }
  .filepond--item-panel { background: #7c3aed; }
  .filepond--credits { display: none; }

  /* Sin lista de archivos: con cientos de imágenes, una fila por cada una
     estira la página muchísimo. Se oculta y el progreso real lo muestra
     el bloque .fp-estado (ver _subida_zona.html). */
  .filepond--list-scroller,
  .filepond--list { display: none !important; }

  /* Mientras FilePond no toma el input, se esconde el selector nativo: al
     navegar con hx-boost los <script src> cargan async y quedaba a la vista el
     "Sin archivos seleccionados" crudo del navegador. El atributo lo pone y lo
     quita el JS, así que sin JavaScript el input se ve y sigue funcionando. */
  .filepond-input[data-esperando] { display: none; }
</style>
<script src="{% static 'vendor/filepond/filepond-plugin-file-validate-type.min.js' %}"></script>
<script src="{% static 'vendor/filepond/filepond-plugin-file-validate-size.min.js' %}"></script>
<script src="{% static 'vendor/filepond/filepond-plugin-image-resize.min.js' %}"></script>
<script src="{% static 'vendor/filepond/filepond-plugin-image-transform.min.js' %}"></script>
<script src="{% static 'vendor/filepond/filepond.min.js' %}"></script>

<script>
  // Motor de subida compartido. Se define una sola vez en window porque hx-boost
  // reejecuta los scripts del body en cada navegación (ver IIFE de abajo).
  //
  // Estrategia: UNA PETICIÓN POR IMAGEN, en cuanto se selecciona.
  // El envío único con las N imágenes dentro (storeAsFile + POST gigante) fallaba
  // en Android: transformar 100 fotos con canvas agota la memoria del navegador,
  // los inputs ocultos nunca se rellenaban y el formulario acababa enviándose
  // vacío ("parece que sube pero no sube nada"). Ahora cada imagen viaja en su
  // propia petición pequeña, se reintenta sola si falla y queda guardada en el
  // servidor (lote borrador), así que nada se pierde al recargar o cambiar de red.
  (function () {
    if (window.initPondSubida) return;

    // El .zip se ofrece SOLO en computador: es una única petición grande, justo
    // lo que falla en el celular con red inestable. Ahí lo correcto es elegir
    // las fotos, que ya suben de a una.
    function esMovil() {
      var uad = navigator.userAgentData;
      if (uad && typeof uad.mobile === 'boolean') return uad.mobile;
      return /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent || '');
    }

    window.initPondSubida = function (cfg) {
      var input = document.querySelector('.filepond-input');
      if (!input || input.dataset.pond) return;

      var zipPermitido = !esMovil();
      if (!zipPermitido) {
        // Antes de que FilePond tome el input: así el selector nativo del
        // celular tampoco lista los .zip, con o sin FilePond cargado.
        input.setAttribute('accept', 'image/*');
        document.querySelectorAll('.solo-pc').forEach(function (el) {
          el.style.display = 'none';
        });
      }

      var raiz = input.closest('form') || document;
      var elCargando = raiz.querySelector('.fp-cargando');

      // Se tapa el input nativo y se muestra el marcador hasta que FilePond
      // esté listo. Como esto vive en JS, sin JavaScript nada se oculta.
      input.setAttribute('data-esperando', '');
      if (elCargando) elCargando.style.display = '';

      function mostrarInputNativo() {
        input.removeAttribute('data-esperando');
        if (elCargando) elCargando.style.display = 'none';
      }

      var elEstado = raiz.querySelector('.fp-estado');
      var elBarra = raiz.querySelector('.fp-barra');
      var elTexto = raiz.querySelector('.fp-texto');
      var btnReintentar = raiz.querySelector('.fp-reintentar');
      var elGuardadas = raiz.querySelector('.fp-guardadas');
      var elGuardadasTxt = raiz.querySelector('.fp-guardadas-txt');
      var btnDescartar = raiz.querySelector('.fp-descartar');
      var btnEnviar = raiz.querySelector('button[type="submit"]');
      var txtEnviar = raiz.querySelector('#btn-text');

      // hx-boost cambia el body sin recargar: el pond de la visita anterior
      // seguiría vivo (con sus archivos en memoria) apuntando a un DOM muerto.
      if (window.__pondAnterior) {
        try { window.__pondAnterior.destroy(); } catch (e) {}
        window.__pondAnterior = null;
      }
      window.__pondEstado = null;

      var intentos = 0;
      (function esperarFilePond() {
        if (!window.FilePond) {
          if (intentos++ > 100) {          // ~10 s: el CDN no cargó (red del celular, bloqueo…)
            // Se devuelve el selector nativo: el POST normal sigue funcionando.
            mostrarInputNativo();
            if (elEstado && elTexto) {
              elEstado.style.display = '';
              elTexto.textContent = 'No se pudo cargar el componente de subida; se usará el selector básico del navegador.';
              if (elBarra) elBarra.parentNode.style.display = 'none';
            }
            return;
          }
          return setTimeout(esperarFilePond, 100);
        }
        arrancar();
      })();

      function arrancar() {
        input.dataset.pond = '1';
        mostrarInputNativo();   // FilePond ya va a absorberlo y darle su propio estilo
        FilePond.registerPlugin(
          FilePondPluginFileValidateType,
          FilePondPluginFileValidateSize,
          FilePondPluginImageResize,
          FilePondPluginImageTransform
        );

        // Se cuentan dos cosas distintas: los ARCHIVOS que el usuario eligió
        // (para la barra de progreso) y las IMÁGENES que quedaron guardadas en
        // el servidor. No coinciden: un .zip es un archivo y muchas imágenes.
        var guardadas = cfg.guardadas || 0;   // imágenes ya en el servidor (sesiones previas)
        var agregadas = 0;                    // archivos elegidos en esta sesión
        var enviados = 0;                     // archivos subidos OK en esta sesión
        var imagenes = 0;                     // imágenes que aportaron esos archivos
        var omitidas = 0;                     // entradas de zip descartadas
        var progreso = {};                    // id de archivo en curso -> 0..1
        var reintentos = {};                  // id de archivo -> reintentos automáticos
        var avisoError = false;

        function datosDe(serverId) {
          // El endpoint responde {"n": imágenes, "omitidas": n}; FilePond lo
          // guarda tal cual como serverId del archivo.
          try {
            var d = JSON.parse(serverId);
            return { n: Math.max(parseInt(d.n, 10) || 1, 1), omitidas: parseInt(d.omitidas, 10) || 0 };
          } catch (e) {
            return { n: 1, omitidas: 0 };
          }
        }

        var pond = FilePond.create(input, {
          name: 'imagenes',
          allowMultiple: true,
          allowImagePreview: false,     // sin miniaturas: evita que cientos de fotos congelen el navegador
          allowRevert: false,           // no se borra archivo a archivo; se descarta el borrador entero
          allowReplace: false,
          acceptedFileTypes: zipPermitido ? ['image/*', 'application/zip'] : ['image/*'],
          // El tipo del .zip llega vacío o raro según el sistema, así que se
          // deduce por extensión. En móvil igual se deduce, pero como no está
          // en acceptedFileTypes se rechaza con un mensaje claro.
          fileValidateTypeDetectType: function (source, type) {
            return new Promise(function (resolve) {
              resolve(/\.zip$/i.test(source.name || '') ? 'application/zip' : type);
            });
          },
          // En PC hay que dar cabida al .zip; el tope real de cada imagen que
          // trae dentro lo aplica el servidor (core/zips.py).
          maxFileSize: zipPermitido ? '500MB' : '30MB',
          maxFiles: 900,
          credits: false,
          itemInsertInterval: 0,        // insertar sin animación (mejor con muchos archivos)
          instantUpload: true,          // sube en cuanto se selecciona
          // Solo 2 en paralelo: en el celular esto limita cuántas imágenes se
          // decodifican a la vez, que es justo lo que reventaba la memoria.
          maxParallelUploads: 2,
          // Compresión en el cliente: 3 MB -> ~80 KB antes de enviar.
          allowImageResize: true,
          imageResizeTargetWidth: 1024,
          imageResizeTargetHeight: 1024,
          imageResizeMode: 'contain',
          imageResizeUpscale: false,
          allowImageTransform: true,
          imageTransformOutputMimeType: 'image/jpeg',
          imageTransformOutputQuality: 82,
          server: {
            url: '',
            process: {
              url: cfg.urlArchivo,
              method: 'POST',
              withCredentials: true,
              headers: { 'X-CSRFToken': cfg.csrf },
              onerror: function (res) {
                try { return JSON.parse(res).error; } catch (e) { return null; }
              },
            },
            // Solo se usa `process`: el resto de endpoints de FilePond no aplican.
            revert: null, load: null, fetch: null, restore: null, patch: null,
          },
          labelIdle: zipPermitido
            ? 'Arrastra o <span class="filepond--label-action">elige imágenes</span> · también un .zip con las fotos dentro'
            : 'Toca para <span class="filepond--label-action">elegir imágenes</span> · hasta 900',
          labelMaxFileSizeExceeded: 'El archivo es muy grande',
          labelFileTypeNotAllowed: zipPermitido
            ? 'Solo se permiten imágenes o un .zip'
            : 'Solo se permiten imágenes (el .zip solo funciona desde el computador)',
        });

        window.__pondAnterior = pond;

        var S = FilePond.FileStatus;

        function fallidos() {
          return pond.getFiles().filter(function (f) {
            return f.status === S.PROCESSING_ERROR || f.status === S.LOAD_ERROR;
          });
        }

        function enCursoAhora() {
          return Math.max(agregadas - enviados - fallidos().length, 0);
        }

        function pintar() {
          var errores = fallidos().length;
          var enCurso = enCursoAhora();
          var totalListas = guardadas + imagenes;

          if (elEstado) {
            if (agregadas) {
              elEstado.style.display = '';
              var hechos = enviados + errores;
              // Se suma el avance parcial de lo que está en vuelo: con un .zip
              // grande (un solo archivo) la barra se movería de 0 a 100 de golpe.
              var parcial = 0;
              for (var id in progreso) parcial += progreso[id];
              var pct = Math.min(Math.round((hechos + parcial) / agregadas * 100), 100);
              if (elBarra) elBarra.style.width = pct + '%';

              if (enCurso) {
                elTexto.textContent = agregadas === 1
                  ? 'Subiendo… ' + pct + '%'
                  : 'Subiendo ' + hechos + ' de ' + agregadas + '… (' + pct + '%)';
              } else if (errores) {
                elTexto.textContent = imagenes + ' imagen(es) subida(s) · ' + errores + ' archivo(s) con error';
              } else {
                elTexto.textContent = imagenes + (imagenes === 1 ? ' imagen subida' : ' imágenes subidas');
              }
            } else {
              elEstado.style.display = 'none';
            }
          }

          if (btnReintentar) {
            btnReintentar.style.display = (errores && !enCurso) ? '' : 'none';
            btnReintentar.textContent = 'Reintentar ' + errores + (errores === 1 ? ' fallido' : ' fallidos');
          }

          if (elGuardadas) {
            elGuardadas.style.display = totalListas ? '' : 'none';
            if (elGuardadasTxt) {
              elGuardadasTxt.textContent = totalListas + (totalListas === 1
                ? ' imagen guardada, lista para ' + cfg.verbo
                : ' imágenes guardadas, listas para ' + cfg.verbo);
            }
          }

          if (btnEnviar) {
            btnEnviar.disabled = enCurso > 0 || totalListas === 0;
            if (txtEnviar) txtEnviar.textContent = enCurso ? 'Subiendo…' : cfg.textoBoton;
          }
        }

        pond.on('addfile', function () { agregadas++; pintar(); });

        pond.on('processfilestart', function (file) { progreso[file.id] = 0; pintar(); });
        pond.on('processfileprogress', function (file, p) { progreso[file.id] = p; pintar(); });

        pond.on('processfile', function (error, file) {
          delete progreso[file.id];
          if (error) {
            // Reintento automático: en móvil los cortes de red son constantes.
            var n = reintentos[file.id] || 0;
            if (n < 2) {
              reintentos[file.id] = n + 1;
              setTimeout(function () {
                try { pond.processFile(file.id).catch(function () {}); } catch (e) {}
              }, 1500 * (n + 1));
            } else if (!avisoError && window.toast) {
              avisoError = true;
              window.toast('Algunos archivos no se pudieron subir. Usa "Reintentar".', 'warning');
            }
          } else {
            var datos = datosDe(file.serverId);
            enviados++;
            imagenes += datos.n;
            if (datos.omitidas) {
              omitidas += datos.omitidas;
              if (window.toast) {
                window.toast('Del .zip se omitieron ' + datos.omitidas +
                  ' archivo(s) que no son imágenes admitidas.', 'warning');
              }
            }
            // Quitarla del pond libera el archivo y su nodo del DOM: con 100+
            // fotos esa memoria es la diferencia entre subir y que se trabe.
            // revert:false → ya está guardada en el servidor, no se deshace.
            setTimeout(function () {
              try { pond.removeFile(file.id, { revert: false }); } catch (e) {}
            }, 0);
          }
          pintar();
        });

        pond.on('processfiles', pintar);
        pond.on('removefile', pintar);
        pond.on('error', pintar);

        if (btnReintentar) {
          btnReintentar.addEventListener('click', function () {
            avisoError = false;
            fallidos().forEach(function (f) {
              reintentos[f.id] = 0;
              try { pond.processFile(f.id).catch(function () {}); } catch (e) {}
            });
            pintar();
          });
        }

        if (btnDescartar) {
          btnDescartar.addEventListener('click', function () {
            if (!confirm('¿Descartar las imágenes subidas que aún no se han procesado?')) return;
            fetch(cfg.urlDescartar, {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'X-CSRFToken': cfg.csrf, 'X-Requested-With': 'XMLHttpRequest' },
            }).then(function (r) {
              if (!r.ok) throw new Error('http ' + r.status);
              guardadas = 0; agregadas = 0; enviados = 0; imagenes = 0;
              omitidas = 0; reintentos = {}; progreso = {};
              pond.removeFiles();
              pintar();
              if (window.toast) window.toast('Imágenes descartadas', 'info');
            }).catch(function () {
              if (window.toast) window.toast('No se pudo descartar', 'error');
            });
          });
        }

        var form = raiz.tagName === 'FORM' ? raiz : document.getElementById('upload-form');
        if (form) {
          form.addEventListener('submit', function (e) {
            var errores = fallidos().length;

            if (enCursoAhora() > 0) {
              e.preventDefault();
              if (window.toast) window.toast('Espera a que terminen de subir los archivos.', 'warning');
              return false;
            }
            if (guardadas + imagenes === 0) {
              e.preventDefault();
              if (window.toast) window.toast('Selecciona al menos una imagen', 'warning');
              else alert('Selecciona al menos una imagen');
              return false;
            }
            if (errores && !confirm(errores + ' archivo(s) no se subieron. ¿Continuar sin ellos?')) {
              e.preventDefault();
              return false;
            }

            // Las imágenes ya están en el servidor: este POST solo encola el lote.
            // Se vacía el input nativo por si el navegador aún guarda la selección,
            // para no reenviar los archivos otra vez en un POST gigante.
            var nativo = document.querySelector('input.filepond--browser');
            if (nativo) { try { nativo.value = ''; } catch (err) {} }

            if (btnEnviar) btnEnviar.disabled = true;
            if (txtEnviar) txtEnviar.textContent = 'Enviando…';
            var overlay = document.getElementById('upload-overlay');
            if (overlay) overlay.style.display = 'flex';
          });
        }

        // Aviso al cerrar con subidas a medias. El listener se registra una sola
        // vez y consulta el pond vigente, así hx-boost no acumula listeners
        // apuntando a ponds muertos.
        window.__pondEstado = function () {
          try { return enCursoAhora(); } catch (err) { return 0; }
        };
        if (!window.__pondUnloadListo) {
          window.__pondUnloadListo = true;
          window.addEventListener('beforeunload', function (e) {
            if (window.__pondEstado && window.__pondEstado() > 0) {
              e.preventDefault();
              e.returnValue = '';
            }
          });
        }

        pintar();
      }
    };
  })();
</script>
