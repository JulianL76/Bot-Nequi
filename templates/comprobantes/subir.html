{% extends "base.html" %}
{% block title %}Subir comprobantes{% endblock %}
{% block header %}Subir{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Subir comprobantes</h1>
<div class="bg-white p-6 rounded-xl shadow max-w-2xl">
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <label id="drop" class="block border-2 border-dashed border-violet-300 dark:border-violet-500/40 rounded-xl p-8 text-center cursor-pointer hover:bg-violet-50 dark:hover:bg-violet-900/20">
      <input type="file" name="imagenes" multiple accept="image/*" class="hidden" id="file-input">
      <svg class="w-10 h-10 mx-auto mb-2 text-violet-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
      <div class="font-medium">Arrastra o haz clic para elegir imágenes</div>
      <div class="text-sm text-slate-500 mt-1">Puedes subir muchas a la vez (se procesan en lotes de 30).</div>
      <div id="file-count" class="mt-3 text-violet-700 font-semibold"></div>
    </label>
    <button class="mt-5 bg-violet-600 text-white px-6 py-2 rounded hover:bg-violet-700">Procesar</button>
  </form>
</div>
<script>
  // IIFE: evita el error "already declared" al re-ejecutarse con hx-boost,
  // que rompía el drag & drop tras navegar entre páginas.
  (function () {
    const inp = document.getElementById('file-input');
    const drop = document.getElementById('drop');
    const cuenta = document.getElementById('file-count');
    if (!inp || !drop) return;

    function actualizar() {
      cuenta.textContent = inp.files.length ? inp.files.length + ' imagen(es) seleccionada(s)' : '';
    }
    inp.addEventListener('change', actualizar);

    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      drop.classList.add('bg-violet-100', 'border-violet-500');
    }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      drop.classList.remove('bg-violet-100', 'border-violet-500');
    }));
    drop.addEventListener('drop', e => {
      inp.files = e.dataTransfer.files;   // asignar los archivos soltados al input
      actualizar();
    });
  })();
</script>
{% endblock %}
